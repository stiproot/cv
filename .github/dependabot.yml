# Every action in .github/workflows/ is pinned to a commit SHA, because a
# mutable tag on a third-party action is a write path into a workflow that
# publishes to Firebase Hosting with a service account secret. Pinning without
# automated updates only trades one risk for another — a stale action with a
# known advisory — so Dependabot keeps the pins moving and rewrites the `# v4`
# comment beside each one.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "ci" }

  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "deps" }
